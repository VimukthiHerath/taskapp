version: "3.8"

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: taskdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tasknet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://taskuser:taskpass@db:5432/taskdb?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tasknet

  frontend:
    build: ./frontend
    networks:
      - tasknet
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
    networks:
      - tasknet

volumes:
  postgres_data:

networks:
  tasknet: