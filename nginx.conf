events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name taskappvk.duckdns.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name taskappvk.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/taskappvk.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/taskappvk.duckdns.org/privkey.pem;

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /tasks {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}